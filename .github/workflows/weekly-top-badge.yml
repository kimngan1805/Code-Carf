name: Weekly Top Badge

on:
  schedule:
    # Monday 00:15 Asia/Ho_Chi_Minh (Sunday 17:15 UTC), right after the Sunday week closes.
    - cron: "15 17 * * 0"
  workflow_dispatch:

concurrency:
  group: weekly-top-badge
  cancel-in-progress: false

jobs:
  award-weekly-top-badge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger weekly-top-1 badge awarding endpoint
        env:
          APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL is not configured in GitHub repository variables/secrets." >&2
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not configured in GitHub repository secrets." >&2
            exit 1
          fi

          base_url="${APP_URL%/}"
          # Retry covers free-tier Render container wake-up (~30-60s).
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 15 --retry-all-errors --max-time 90 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$base_url/api/cron/weekly-top-badge"
