name: Feature
description: Plan a feature for a sprint
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should users be able to do?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: input
    id: sprint
    attributes:
      label: Sprint
