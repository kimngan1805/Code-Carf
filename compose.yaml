services:
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://codecarf:${POSTGRES_PASSWORD}@db:5432/codecarf?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: http://localhost:3000
      GRADER_ADAPTER: ${GRADER_ADAPTER:-mock}
      JUDGE0_URL: http://judge0:2358
    depends_on:
      migrate: { condition: service_completed_successfully }
  migrate:
    build:
      context: .
      target: build
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://codecarf:${POSTGRES_PASSWORD}@db:5432/codecarf?schema=public
    depends_on:
      db: { condition: service_healthy }
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codecarf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: codecarf
    ports: ["5432:5432"]
    volumes: ["db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codecarf"]
      interval: 5s
      retries: 10
  judge0:
    profiles: ["judge0"]
    image: judge0/judge0:1.13.1
    privileged: true
    volumes: ["./docker/judge0/judge0.conf:/judge0.conf:ro"]
    environment:
      POSTGRES_HOST: judge0-db
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD}
      POSTGRES_DB: judge0
      REDIS_HOST: judge0-redis
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD}
      SECRET_KEY: ${JUDGE0_SECRET_KEY}
    ports: ["2358:2358"]
    depends_on: [judge0-db, judge0-redis]
  judge0-worker:
    profiles: ["judge0"]
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    privileged: true
    volumes: ["./docker/judge0/judge0.conf:/judge0.conf:ro"]
    environment:
      POSTGRES_HOST: judge0-db
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD}
      POSTGRES_DB: judge0
      REDIS_HOST: judge0-redis
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD}
      SECRET_KEY: ${JUDGE0_SECRET_KEY}
    depends_on: [judge0-db, judge0-redis]
  judge0-db:
    profiles: ["judge0"]
    image: postgres:16.2
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD}
      POSTGRES_DB: judge0
    volumes: ["judge0_data:/var/lib/postgresql/data"]
  judge0-redis:
    profiles: ["judge0"]
    image: redis:7.2.4
    command:
      [
        "sh",
        "-c",
        'redis-server --appendonly no --requirepass "$$REDIS_PASSWORD"',
      ]
    environment:
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD}
volumes:
  db_data:
  judge0_data:
